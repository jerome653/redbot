# Windows installer for redbot.
#
# WHAT SHIPS, AND WHAT DELIBERATELY DOES NOT.
#
# `files` is an allow-list, not an exclude-list. The default would sweep in the whole working tree —
# including `data/` (Chrome profiles, session cookies, the operator's evidence), `db/.env` (the vault
# master key) and `reports/`. Shipping any of those in an installer is the Appilot mistake
# src/config.ts opens by naming: an APK that carried two live API keys.
#
# So only four things are packaged: the compiled engine, the console, the SQLite schema, and the
# Electron shell.
appId: com.sgen.redbot
productName: redbot
copyright: redbot

directories:
  output: release
  buildResources: electron/build

files:
  - dist/**/*                      # the compiled engine
  - electron/main.mjs              # the shell
  - electron/preload.cjs
  - electron/vault-key.mjs
  - electron/updater.mjs           # in-place updates, driven only by the button
  - tools/product/**/*             # the console: server + the single-file UI
  - db/sqlite/migrate.mjs          # the schema, and the runner that applies it
  - db/sqlite/migrations/**/*
  - package.json
  # Never: data/ · db/.env · db/migrations (Postgres) · reports/ · qa/ · src/ · the .md write-ups.
  - '!**/*.map'                    # source maps double dist/ and ship nothing a user can act on
  - '!electron/.shots/**'
  - '!tools/product/.ui-shots/**'
  - '!tools/product/*.test.mjs'
  - '!tools/product/ui-fixture.mjs'
  - '!tools/product/port-fixture.mjs'
  - '!db/sqlite/*.test.mjs'
  - '!db/sqlite/reset-test-db.mjs'
  - '!db/sqlite/.env.test'
  - '!electron/*.test.mjs'

# WHERE AN UPDATE COMES FROM.
#
# This block is what makes in-place updates possible at all: electron-builder writes it into the
# package as `resources/app-update.yml`, and that file is the ONLY thing that tells the installed
# app where to look. Without it, electron-updater throws "app-update.yml is missing" and the Apply
# button reports exactly that. It also makes `latest.yml` — the manifest carrying the SHA512 the
# download is checked against — part of what has to be uploaded to a release.
#
# The repository matches `UPDATE_REPO` in src/update.ts, which is what the passive update NOTICE
# already reads. Two different repositories for "is there an update" and "install the update" would
# be a trap.
#
# NOTE ON TRUST. There is no code-signing certificate (see `win:` below). electron-updater only
# verifies a publisher signature when `publisherName` is present in app-update.yml, which requires
# signing — so for this build the integrity check is the SHA512 in latest.yml, fetched over HTTPS
# from GitHub. That means whoever controls this repository's releases controls what the app will
# install. That is the same trust an operator extends by downloading the installer by hand, but it
# is now extended once per click instead of once per download, which is the trade this makes.
publish:
  - provider: github
    owner: jerome653
    repo: redbot
    # SET EXPLICITLY, because the default is `draft` and a draft release is INVISIBLE to the
    # updater — it appears in neither the releases Atom feed nor /releases/latest, so the app would
    # report "no published versions" while the release sat there looking published.
    #
    # `release` rather than `prerelease` only because a plain visible release is the least
    # surprising thing to publish. Either works: electron/updater.mjs sets `allowPrerelease = true`,
    # which makes the updater read the Atom feed and find prereleases too. A DRAFT is the one thing
    # that cannot work, whatever the updater is configured to do.
    releaseType: release

# Playwright is a runtime dependency because src/browser.ts attaches to the operator's Chrome over
# CDP. Only `playwright-core` is needed for connectOverCDP — the browser binaries it downloads are
# never used, because redbot deliberately does not launch browsers (src/browser.ts). They are
# excluded rather than pruned so the exclusion is visible.
asarUnpack:
  - node_modules/playwright-core/**

win:
  target:
    - target: nsis
      arch: [x64]
    # THE SMALL FILE TO HAND SOMEBODY — and what "small" can and cannot mean here.
    #
    # This app is Electron + Chromium + Playwright. Roughly 100 MB has to reach the machine one
    # way or another; the only question is whether it travels inside the file you send or is
    # fetched at install time. `nsis-web` is the second: a ~1.5 MB stub that downloads
    # `${productName}-${version}-x64.nsis.7z` from this release and installs it. That is the
    # lightweight installer, and it is the only one.
    #
    # Rejected, for the record: a `zip` target. Built once on 2026-08-13 and it came out at
    # 143,654,954 bytes — LARGER than the 103 MB installer, because NSIS compresses and a zip of
    # the unpacked tree does not. It also cannot self-update. It was the wrong answer to "light".
    #
    # NOTE ON latest.yml. Build this target in its own output directory
    # (`--config.directories.output=release-web`) and do NOT upload the latest.yml it writes. The
    # installed app is an NSIS install and its updater reads `path:` from the release's latest.yml;
    # the web variant writes a different one, and one file cannot be both without risking the
    # update path this project has already proved twice.
    - target: nsis-web
      arch: [x64]
  # No signing configured. An unsigned installer shows a SmartScreen warning; a certificate is a
  # purchase and a decision for whoever publishes this, not something to fake here.

  # THE FILENAME THE UPDATER LOOKS FOR, AND THE ONE ON DISK, MUST BE THE SAME STRING.
  #
  # Left unset, electron-builder writes "redbot Setup 2.0.0.exe" (spaces) but sanitises the name in
  # latest.yml to "redbot-Setup-2.0.0.exe" (hyphens). Upload the file under its disk name and the
  # updater fetches a 404 forever; the release looks complete and every install silently stops
  # updating. This has already cost one release, and a release checklist is the wrong place to fix
  # something a config line can make impossible.
  artifactName: ${productName}-Setup-${version}.${ext}

# THE WEB STUB MUST NOT BE CALLED WHAT THE FULL INSTALLER IS CALLED.
#
# `win.artifactName` above applies to every Windows target, so the nsis-web stub was written as
# `redbot-Setup-3.1.0.exe` — byte for byte the same NAME as the 103 MB installer, at 726,824
# bytes. latest.yml points the updater at that exact filename, so publishing the stub under it
# would leave every update installing a downloader instead of the app. Caught on 2026-08-13
# before upload; pinned here so it cannot happen again.
nsisWeb:
  artifactName: ${productName}-Web-Setup-${version}.${ext}

nsis:
  oneClick: false                  # let a person choose the install directory
  perMachine: false                # per-user: no elevation, and userData is per-user anyway
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # An uninstall must NOT take the evidence with it. userData holds the database, the Chrome
  # profiles and the operator's corpus; deleting it on uninstall would destroy the record.
  deleteAppDataOnUninstall: false
